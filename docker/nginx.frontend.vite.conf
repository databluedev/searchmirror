# Static host for the built Vite frontend. Used by the app-prod service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml font/woff font/woff2;

    # Vite hashes these filenames, so a stale copy can never be the wrong build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell names the hashed chunks, so caching it would pin the old build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Every unknown path is a client-side route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
