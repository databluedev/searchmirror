  <!-- The SearchMirror mark: two chevrons facing away from each other around a
       shared lens. The mirror is the point — the same shape twice, reflected
       through the centre, so the form reads as reflection before it reads as an
       S. Traced from the master raster (app/src/assets/images/logo-dark.png),
       IoU 0.9897 against it.

       Uses currentColor so it inherits from context: black on the light
       marketing ground, white on an inverted footer, --accent nowhere. Do not
       add a fill here. For the tile form (--ink mark on a --paper ground) use
       logo-tile.svg instead.

       Legibility: the counters between the chevrons and the lens close up
       below about 20px, so use the tile below that size, not this. -->
